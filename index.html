<body>

    <canvas id="orbs"></canvas>

    <header class="header">
        <div class="logo">PORTFOLIO.</div>
        <nav>
            <a href="index.html" class="active">Home</a>

    <section class="hero">

    </section>

    <!-- Typing Effect JS -->
    <script>
        const text = "Machine Learning Engineer | AI | Python | DevOps | Cloud | AWS | Kubernetes";
        let i = 0;

        function typingEffect() {
            if (i < text.length) {
                document.querySelector(".typing").innerHTML += text.charAt(i);
                i++;
                setTimeout(typingEffect, 80);
            }
        }
        typingEffect();
    </script>

    <script src="orbs.js"></script>
